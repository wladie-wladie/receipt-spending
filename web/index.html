<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Траты</title>
<meta name="description" content="Учёт всех трат: уведомления банка, фото чеков и ручной ввод. Покажет, на что уходят деньги.">
<meta name="theme-color" content="#1D6B57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Траты">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month">
      <button id="prev" aria-label="Предыдущий месяц">‹</button>
      <span id="mlabel">—</span>
      <button id="next" aria-label="Следующий месяц">›</button>
    </div>
    <div class="top-actions">
      <button class="pill" id="addManual">+ Без чека</button>
      <button class="icon-btn" id="openSettings" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="banner"></div>

  <section id="view-spend">
    <div class="summary">
      <div class="label">Потрачено за месяц</div>
      <div class="big" id="total">0,00<small>₾</small></div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-stats" hidden>
    <button type="button" class="report-btn" id="openReport">
      <span><b>Отчёт за месяц</b><small>Итоги, сравнение с прошлым месяцем и картинка, которой можно поделиться</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="seg-tabs">
      <button type="button" id="st-all" aria-pressed="true">Все траты</button>
      <button type="button" id="st-food" aria-pressed="false">Продукты</button>
    </div>
    <div id="stats-all">
      <div class="card"><h2>По категориям</h2><div id="spendCats"></div></div>
      <div class="card"><h2>Где трачу больше всего</h2><ul class="top-items" id="topPlaces"></ul></div>
    </div>
    <div id="stats-food" hidden>
      <div class="card"><h2>Продукты по группам</h2><div id="cats"></div></div>
      <div class="card"><h2>На что уходит больше всего</h2><ul class="top-items" id="topItems"></ul></div>
      <div class="card"><h2>Чаще всего покупаю</h2><ul class="top-items" id="freqItems"></ul></div>
    </div>
  </section>
</div>

<nav class="nav">
  <div class="nav-in" role="tablist">
    <button class="tab" role="tab" id="tab-spend" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      Траты
    </button>
    <div class="cam-wrap">
      <button class="cam" id="camBtn" aria-label="Сфотографировать чек">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
      </button>
      <span class="cam-label">Чек</span>
    </div>
    <button class="tab" role="tab" id="tab-stats" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      Аналитика
    </button>
  </div>
</nav>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/capacitor.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
