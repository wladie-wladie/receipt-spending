name: Сборка сайта, обновлений и APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    name: Сайт и пакет обновления
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Собрать сайт и пакет обновления
        run: |
          mkdir -p _site/updates
          cp -r www/. _site/
          (cd www && zip -qr "../_site/updates/bundle-${APP_VERSION}.zip" .)
          cat > _site/update.json <<JSON
          {"version":"${APP_VERSION}","url":"https://wladie-wladie.github.io/receipt-spending/updates/bundle-${APP_VERSION}.zip","builtAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          touch _site/.nojekyll
      - name: Положить APK на сайт
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: Собрать APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../traty.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: traty.apk
          retention-days: 3
      - name: Опубликовать APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Траты по чекам — APK
          body: |
            Последняя сборка: версия ${{ env.APP_VERSION }}.
            Установите traty.apk на Android. Дальше приложение обновляется само, переустанавливать APK нужно только если об этом попросят.
          files: traty.apk
          make_latest: true
          overwrite_files: true
